services:
  api:
    build: .
    container_name: clinic_management
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    
    networks:
      - clinic_network 

  db:
    image: mysql:8
    container_name: clinic_db
    restart: always
    env_file:
      - .env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - clinic_network

volumes:
  mysql_data:
  
networks:
  clinic_network: